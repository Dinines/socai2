schema: spec-driven

context: |
  Language: zh-CN. 正文使用中文，保留 OpenSpec 结构标题及 SHALL/MUST、WHEN/THEN。
  本仓库负责告警分诊、事件诊断、Case 调查及其存储和读取，不自动扩展到采集、原始检测或整个平台。
  长期规则见 AGENTS.md；当前部署、证据与下一步见 PROGRESS.md，功能／表／字段／接口见 FRONTEND_BACKEND_HANDOFF.md。
  当前调查变更使用 complete-socai2-investigation-chain，不复制任务树。行为／API／持久化／模型调用／部署变更先写规格和直接验收；纯文档维护可 skip_specs。
  已确认调查数据库由迁移 123–126 定义，共 29 表462列。任何表设计变化须负责人明确人工确认，保留冻结原件，用增量迁移实施。
  运行配置由显式 profile 提供；凭据仅留受控私有文件。目标为21，SSH别名 sting-infra21，具体地址／角色／端口按当前配置核实。
  测试替身、真实数据库、真实模型及生产观测分别记录；保存成功不代表质量通过。失败、unknown、原答及既有数据保留。
  前后端读取验收和模型质量分别管理；自动消费、知识消费、真实处置须有实际执行证据，不能由连通或表存在推断。
  上游参考固定 beenuar/AiSOC revision 34ca18c57dd4175539e5c6dd3d04a72dc057306b；只读参考，不自动升级。

rules:
  proposal:
    - 写明问题、最小范围、所属路线change、前置回执和影响；不扩大服务端职责。
    - 声明规格是目标合同还是已有验收事实；无规格级行为变化时用skip_specs，不编造业务能力。
  specs:
    - 每个Requirement使用SHALL或MUST，并至少有一个四级Scenario及WHEN/THEN。
    - 仅核本批直接业务结果、所需缺源/身份边界；复用已有重投/unknown保护，可用性矩阵和playbook/反馈专项后置，不将替身视为真实模型或厂商。
    - 已冻结判据、原结果与失败不得改写；模型建议、有效决定、批准、执行及验证分别表达。
  design:
    - 给出固定源码差异归属、实际运行来源、依赖及最小改法，不先换架构。
    - 列实际变更所需的运行来源、调用/资源边界及最小回退；不重新引入已暂缓的启动/退出/恢复矩阵作为功能前置。
    - 不为仅原样整体迁入的模块增加设计或测试任务；冗余设计登记后置，优先修现有调用/数据语义。
  tasks:
    - 使用编号复选框，每项附验证方式或证据产物，只有实际完成才勾选。
    - 包含直接验证、未参与实现者独审、回执/来源/PROGRESS更新及归档前检查；归档操作和封后校验另记audit，避免任务自指。
    - 验证按本次功能变化最小化，复用已有测试；不默认重跑全仓/全部依赖专项，一体原样迁入可记未专项验证。

operations:
  apply:
    guidance:
      - 先核分支、未提交内容、相关规格/执行卡及运行状态；遵守已授权范围，不扩大操作。
      - CLI校验和文档齐全不代表业务通过；沿用已有受控边界，只核本次实际操作必要条件，不默认重做旧全量冻结、计数或恢复验收。
      - 当前调查 change 为 complete-socai2-investigation-chain；按用户本轮授权和直接证据推进，历史批次限制不自动延续，未完成任务不核销，不重调 unknown。
      - 已有非阻塞问题统一登记；主链、tenant、持久、批准阻塞先修，不以登记替代。
  archive:
    guidance:
      - 仅在任务有实际证据、直接验收及未参与实现者结束审计通过后归档。
      - 同步实际交付的规格增量，复核PROGRESS/回执/来源；不得把未来任务或受控停止写成质量通过。
