function detail(parent,title,text,open=false,cls=""){const d=node("details",null,cls);d.open=open;d.append(node("summary",title),node("pre",text));parent.append(d);}
function json(value){return JSON.stringify(value,null,2);}
for(const [id,key] of [["title","page_title"],["heading","title"],["description","description"],["notice","notice"],["method","method"]])$(id).textContent=presentation[key]||"";
document.title=$("title").textContent+" · 调查工作台";
$("batch").textContent=data.batch+" · "+(presentation.status||"见实际回执");
for(const text of presentation.findings||[])$("findings").append(node("li",text));
for(const sample of data.samples){for(const cell of sample.cells){
 const card=node("article");card.id=cell.id;card.append(node("h2",sample.title),node("p",sample.note,"note"));
 const responseReceived=cell.state==="response_received";
 card.append(node("span",responseReceived?"已收到模型原答":"未取得完整原答","badge"),node("span",cell.accepted?"结构及引用校验通过":"结构或引用校验未通过","badge"+(cell.accepted?"":" reject")));
 const metrics=node("div",null,"metrics");
 for(const [label,value] of [["输入 tokens",cell.usage?.input_tokens],["输出 tokens",cell.usage?.output_tokens],["HTTP 秒数",cell.http_seconds==null?null:cell.http_seconds.toFixed(2)]]){const item=node("div",label);item.append(node("b",value??"未知"));metrics.append(item);}card.append(metrics);
 if(cell.answer?.diagnosis){detail(card,"模型给出的整体诊断",json(cell.answer.diagnosis),true,"diagnosis");}
 detail(card,"模型输入 · 用户正文（"+cell.user_bytes+" B）",cell.user,true,"model-input");
 detail(card,"模型输入 · 任务指令",cell.system);
 detail(card,"模型输入 · 要求的输出格式",json(cell.response_format));
 detail(card,"模型原始输出",cell.content||"没有取得模型正文，见完整响应回执。",true,"raw-output");
 detail(card,"程序校验结果",json({state:cell.state,wire_schema_valid:cell.wire_schema_valid,canonical_schema_valid:cell.canonical_schema_valid,accepted:cell.accepted,parse_error:cell.parse_error,diagnostics:cell.diagnostics,partial_review:cell.partial_review||null}));
 detail(card,"程序装配后的结果",cell.parsed_output?json(cell.parsed_output):"没有可采用的完整装配结果。原答保持不变；合法片段见校验结果。");
 const links=node("div",null,"downloads");for(const [title,path] of [["完整请求 JSON",cell.request_path],["模型响应 JSON",cell.response_path],["校验与装配 JSON",cell.parsed_path]]){const link=node("a",title);link.href=path;link.download="";links.append(link);}card.append(links);$("records").append(card);
}}
</script></body></html>
