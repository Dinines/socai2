[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socai2-investigation-test"
version = "0.6.2"
description = "Independent investigation test ledger and read API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.117,<0.142", "pydantic>=2.7,<2.15", "uvicorn>=0.29,<0.55", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
drivers = ["aiokafka>=0.14,<0.15", "asyncpg>=0.31,<0.32", "clickhouse-driver>=0.2.11,<0.3", "python-dotenv>=1.2,<2"]

[project.scripts]
investigation-test = "investigation_test.__main__:main"

[tool.setuptools]
packages = ["investigation_test"]
package-dir = {investigation_test = "."}

[tool.setuptools.package-data]
investigation_test = ["web/*"]
