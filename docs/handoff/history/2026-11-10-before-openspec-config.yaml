  当前报告只需Markdown生成、持久及按Case/Run读取；PDF暂缓，HTML非当前前置，既有格式代码和历史结果保留，不追加报告模型/格式专项。
  当前三个工作目的：迁移告警处理流程并保证功能/结果正确；结合源码对照固定官方文档识别声明/实现差距；梳理架构功能及二开扩展点。
  官方对照和架构文档随范围内实际迁移更新，不扩全平台审计、先行重构或所有上游缺口修复。
  最新范围为完整告警/调查（含自动分诊、自动关闭、自动升级），review_only仅是当前限制而非最终目标。
  2026-10-21追加按原版设计迁入full配套历史补查、Attack Path、UEBA、事件检索、IOC信誉增强及OpenSearch原版索引/检索；只做可运行必需接线和最少验证，原版缺失后端登记后置。
  用户已于2026-10-21明确开始实施并允许并行worker；restore-alert-investigation-integrity进入按批实现阶段，完成状态以实际证据为准。
  当前Fusion阶段后进入Agents分诊，先按支持/默认/输入输出/依赖/规则模型/关闭升级及实例分析，再讨论取舍。调查须逐节点、每次Agent/模型/工具调用说明输入、查询/参数、采用、分支与审计，不把可用工具清单当实际调用或合并原编排。
  用户最新要求本地先验证，可借21基础设施；保留本地版本或需要时的本地镜像，按阶段统一发布，不因每次更新或测试通过自动部署21。当前分诊/调查分析增量不启worker、不追加模型或重调旧输入。
  后续唯一总执行表为completion-plan.md的B1—B6，映射现有六阶段及restore原任务，不复制产品任务树。
  用户随后已要求继续执行：功能接通优先，原测试保留/按需复用，复杂可用性与冗余问题登记后置；UEBA沿上游投喂触发，先明确消息格式/入口/计算，不新增实体名单控制或滑动窗口。上一轮仅规划不限制当前已授权执行。
  最新先完成路线规划和纪要，再按UEBA→威胁情报/IOC→20上一版既有知识库→Fusion→分诊→调查/攻击路径→Markdown交付逐模块推进。UEBA重点实体启用、基线时间/样本配置、输入输出及偏离算法；IOC数据量/覆盖率暂缓，知识库历史经验后看。属性表见module-review-plan.md，本轮仅规划不改变运行或完成状态。
  自动主线包括真实告警自动触发、自动分诊、按策略关闭或无需人工再点的升级取证/知识/分析及结果报告交付。
  告警到实际自动调查和基本结果读取的第一步已有实证；当前补full配套服务和直接依赖，旧质量失败保留，产品待办仅在实际责任及验证完成后勾选。
  R02按status.md暂缓，原0/17及五文件/hash不变；CLI的ready不授权执行，亦非功能接入前置。
  playbook/反馈一体源码依赖原样保留，不额外改测；启动/退出/故障恢复等可用性专项登记后置。
  总原则为功能完整、结果正确优先；所有一体模块/依赖均可整体原样迁入，不额外修改或测试，不限于playbook/反馈。
  冗余抽象、多层包装、提前统一架构及服务可用性测试/修复登记暂缓，只做本次实际功能变化必需的最少验证。
  I2正常graph用量覆盖是本轮业务问题；仅故障/重投恢复接续先后置，不为此先建通用阶段账本或恢复框架。
  自治质量仍未通过，新change不追认旧失败；不以减免专项测试宣称功能已完整或运行已启用。
  21是目标，20仅参考，43沿用现有对话服务；普通授权已给定，不逐批重复请求确认。
  真实高风险动作仍须明确受控目标、凭据、授权与对应审批；未知副作用不自动重发。
  不覆盖旧数据/证据，不清全库全卷，不输出凭据或隐藏推理，不自动提交或推送Git。

rules:
  proposal:
    - 写明问题、最小范围、所属路线change、前置回执和影响；不扩大服务端职责。
    - 声明规格是目标合同还是已有验收事实；无规格级行为变化时用skip_specs，不编造业务能力。
  specs:
    - 每个Requirement使用SHALL或MUST，并至少有一个四级Scenario及WHEN/THEN。
    - 仅核本批直接业务结果、所需缺源/身份边界；复用已有重投/unknown保护，可用性矩阵和playbook/反馈专项后置，不将替身视为真实模型或厂商。
    - 已冻结判据、原结果与失败不得改写；模型建议、有效决定、批准、执行及验证分别表达。
  design:
    - 给出固定源码差异归属、实际运行来源、依赖及最小改法，不先换架构。
    - 列实际变更所需的运行来源、调用/资源边界及最小回退；不重新引入已暂缓的启动/退出/恢复矩阵作为功能前置。
    - 不为仅原样整体迁入的模块增加设计或测试任务；冗余设计登记后置，优先修现有调用/数据语义。
  tasks:
    - 使用编号复选框，每项附验证方式或证据产物，只有实际完成才勾选。
    - 包含直接验证、未参与实现者独审、回执/来源/PROGRESS更新及归档前检查；归档操作和封后校验另记audit，避免任务自指。
    - 验证按本次功能变化最小化，复用已有测试；不默认重跑全仓/全部依赖专项，一体原样迁入可记未专项验证。

operations:
  apply:
    guidance:
      - 先核分支、未提交内容、相关规格/执行卡及运行状态；遵守已授权范围，不扩大操作。
      - CLI校验和文档齐全不代表业务通过；沿用已有受控边界，只核本次实际操作必要条件，不默认重做旧全量冻结、计数或恢复验收。
      - 当前完整性change已获实施授权，按B1—B6直接推进必要修复、隔离验证及定向部署；R02仍按status暂缓，自治启用依赖实际功能证据，不改旧失败或重调unknown。
      - 已有非阻塞问题统一登记；主链、tenant、持久、批准阻塞先修，不以登记替代。
  archive:
    guidance:
      - 仅在任务有实际证据、直接验收及未参与实现者结束审计通过后归档。
      - 同步实际交付的规格增量，复核PROGRESS/回执/来源；不得把未来任务或受控停止写成质量通过。
