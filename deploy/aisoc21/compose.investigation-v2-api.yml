name: socai2-investigation
services:
  investigation-api:
    container_name: socai2-investigation-api
    image: socai2-investigation-api:20261031-r3
    env_file:
      - path: /opt/sting-aisoc-socai2/private/investigation-v2.env
        format: raw
    ports: ["127.0.0.1:18010:8000"]
    volumes:
      - /opt/sting-aisoc-socai2/certificates/socai2-ca.crt:/run/certs/ca.crt:ro
      - /opt/sting-aisoc-socai2/private/identity-graph-3a:/run/secrets/identity-graph:ro
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [existing]
networks:
  existing:
    external: true
    name: socai2_default
