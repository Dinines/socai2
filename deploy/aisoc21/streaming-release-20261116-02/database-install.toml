database = "aisoc"
admin_role = "spirithub"
function_owner = "aisoc"
reader_role = "aisoc_app"
timeout_seconds = 120
transport = "docker_socket"
psql_argv = ["docker", "--context", "default", "exec", "-i", "spirithub-postgres-1", "psql", "-XwAtq"]
environment = {}
[analysis]
writer_role = "socai2_prod_processor"
lock_timeout_seconds = 3
statement_timeout_seconds = 30
[analysis_ingress]
role = "socai2_prod_ingress"
lock_timeout_seconds = 3
statement_timeout_seconds = 30
