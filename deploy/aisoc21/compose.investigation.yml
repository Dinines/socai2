name: socai2
services:
  agents:
    image: socai2-agents:1g-20261020
    env_file: /opt/sting-aisoc-socai2/private/agents-1g.env
    user: "10001:10001"
    ports: ["127.0.0.1:18004:8084"]
    volumes: ["/opt/sting-aisoc-socai2/certificates/socai2-ca.crt:/run/certs/ca.crt:ro"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    cpus: 4
    mem_limit: 8g
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/readyz',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  actions:
    image: socai2-actions:1g-20261020
    env_file: /opt/sting-aisoc-socai2/private/actions-1g.env
    user: "10001:10001"
    ports: ["127.0.0.1:18005:8085"]
    volumes: ["/opt/sting-aisoc-socai2/certificates/socai2-ca.crt:/run/certs/ca.crt:ro"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/readyz',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
