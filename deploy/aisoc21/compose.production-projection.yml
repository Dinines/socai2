name: socai2-investigation-projection
services:
  projection:
    image: ${SOCAI2_PROJECTION_IMAGE:?Select the coordinated processing release image}
    container_name: socai2-investigation-projection
    entrypoint: [python, -B, /opt/processor/production_projection.py]
    command: [serve, --profile, "${SOCAI2_PROJECTION_CONFIG_MOUNT:?Select projection config mount}"]
    user: "10001:10001"
    env_file:
      - path: /opt/sting-aisoc-socai2/private/processing-production/ingress.env
        format: raw
    environment:
      KAFKA_SECURITY_PROTOCOL: SSL
      KAFKA_SSL_CAFILE: /run/certs/ca.crt
    volumes:
      - ./production_projection.py:/opt/processor/production_projection.py:ro
      - ./production_ingress.py:/opt/processor/production_ingress.py:ro
      - ./projection_config.py:/opt/processor/projection_config.py:ro
      - ${SOCAI2_PROJECTION_CONFIG_HOST_FILE:?Select projection config}:${SOCAI2_PROJECTION_CONFIG_MOUNT:?Select projection config mount}:ro
      - ${SOCAI2_ANALYSIS_TASKS_HOST_FILE:?Select lifecycle config}:${SOCAI2_ANALYSIS_TASKS_MOUNT:?Select lifecycle config mount}:ro
      - /opt/sting-aisoc-socai2/certificates/socai2-ca.crt:/run/certs/ca.crt:ro
      - /opt/sting-aisoc-socai2/state/production-projection:/var/lib/socai2-projection:ro
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -B, /opt/processor/production_projection.py, health, --profile, "${SOCAI2_PROJECTION_CONFIG_MOUNT:?Select projection config mount}"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [existing]
networks:
  existing:
    external: true
    name: socai2_default
