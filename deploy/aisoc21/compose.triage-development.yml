# Apply last while the existing consumer recovery is still being validated.
services:
  agents:
    environment:
      # Disables the optional tenant-wide calls/tokens/unsettled quotas.
      AISOC_TRIAGE_BUDGET_POLICY_FILE: ""
      # Preserve the currently inactive consumer during this configuration rollout.
      # Set to "0" when the separately tracked consumer recovery is ready.
      AISOC_AGENT_KAFKA_DISABLE: "1"
