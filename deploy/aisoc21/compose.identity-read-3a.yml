services:
  api:
    image: socai2-api:identity-read-3a-20261020
    environment:
      AISOC_IDENTITY_GRAPH_CONFIG_FILE: /run/secrets/identity-graph/config.json
    volumes:
      - /opt/sting-aisoc-socai2/private/identity-graph-3a:/run/secrets/identity-graph:ro
  agents:
    image: socai2-agents:identity-read-3a-20261020
    environment:
      AISOC_TRIAGE_IDENTITY_KEYS_FILE: /run/secrets/triage-identity/keys.json
    volumes:
      - /opt/sting-aisoc-socai2/private/identity-read-3a:/run/secrets/triage-identity:ro
