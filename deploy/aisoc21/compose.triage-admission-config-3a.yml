# Configuration only. Readiness of these settings does not admit the worker.
# The existing investigation layer already mounts this CA read-only.
services:
  agents:
    environment:
      AISOC_AGENT_KAFKA_DISABLE: "1"
      AISOC_AGENT_RAISE_APPROVALS: "0"
      KAFKA_BOOTSTRAP_SERVERS: "192.168.1.21:19093"
      KAFKA_SECURITY_PROTOCOL: SSL
      KAFKA_SSL_CAFILE: /run/certs/ca.crt
