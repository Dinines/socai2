name: socai2
services:
  api:
    env_file:
      - /opt/sting-aisoc-socai2/private/full-threatintel-20261021/api-threatintel.env
  threatintel:
    image: socai2-threatintel:full-http-20261021
    env_file:
      - /opt/sting-aisoc-socai2/private/threatintel-full-20261021.env
      - /opt/sting-aisoc-socai2/private/full-support-20261021/graph.env
    user: "10001:10001"
    ports: ["127.0.0.1:18008:8005"]
    # Reuse the existing OpenSearch network; its service remains unmodified.
    networks: [default, opensearch]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/readyz',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  opensearch:
    external: true
    name: spirithub_default
