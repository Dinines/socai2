# Only the independent API receives this additional env file.
# Compose merges env_file lists in order; the original api.env stays unchanged.
services:
  api:
    environment:
      SOCAI2_MODEL_PROTOCOL: deepseek_responses
      SOCAI2_MODEL_SCHEMA_PROFILE: standard
    env_file:
      - path: /opt/sting-aisoc-socai2/private/next-20261104/model.deepseek.env
        format: raw
