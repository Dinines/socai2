name: socai2
services:
  enrichment:
    image: socai2-enrichment:full-20261021
    env_file: /opt/sting-aisoc-socai2/private/enrichment-full-20261021.env
    user: "10001:10001"
    ports: ["127.0.0.1:18002:8082"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 6
