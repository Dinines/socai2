# Prepared for unified release; selecting this file does not execute a deployment.
services:
  fusion:
    environment:
      AISOC_LAKE_WRITER_ENABLED: "true"
      AISOC_LAKE_INGRESS_PROFILE_FILE: /run/lake-ingress/ingress.json
      AISOC_LAKE_CONSUMER_PROFILE_FILE: /run/lake-ingress/consumer.json
      CLICKHOUSE_CONNECT_TIMEOUT_SECONDS: ${CLICKHOUSE_CONNECT_TIMEOUT_SECONDS:?Select native connect timeout}
      CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS: ${CLICKHOUSE_SEND_RECEIVE_TIMEOUT_SECONDS:?Select native request timeout}
    volumes:
      - ${LAKE_INGRESS_PROFILE_DIR:?Select matching ingress and storage profiles}:/run/lake-ingress:ro
