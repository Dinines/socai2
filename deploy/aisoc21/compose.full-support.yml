name: socai2
services:
  api:
    env_file:
      - /opt/sting-aisoc-socai2/private/full-support-20261021/lake.env
      - /opt/sting-aisoc-socai2/private/full-support-20261021/graph.env
    environment:
      AISOC_DISABLE_CLICKHOUSE: "false"
      AISOC_DISABLE_NEO4J: "false"
  fusion:
    env_file:
      - /opt/sting-aisoc-socai2/private/full-support-20261021/lake.env
    environment:
      AISOC_LAKE_WRITER_ENABLED: "true"
      KAFKA_TOPIC_RAW_EVENTS: socai2.raw_events.v1
      KAFKA_TOPIC_UEBA_ANOMALIES: socai2.ueba.anomalies.v1
