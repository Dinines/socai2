# Apply only to the existing sting-infra21 infrastructure project.
# The image already ships labs/apoc-5.15.0-core.jar; no plugin download is needed.
services:
  neo4j:
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - /opt/sting-aisoc-socai2/runtime-data/neo4j-plugins:/plugins
