name: socai2-next
services:
  api:
    container_name: socai2-next-api
    image: socai2-next-api:20261104-n1
    command: [python, -m, uvicorn, app.socai2_main:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    env_file:
      - path: /opt/sting-aisoc-socai2/private/next-20261104/api.env
        format: raw
    environment:
      SOCAI2_MODEL_PROTOCOL: chat_completions
      SOCAI2_MODEL_SCHEMA_PROFILE: vllm_grammar_v1
    ports: ["127.0.0.1:18020:8000"]
    volumes:
      - /opt/sting-aisoc-socai2/certificates/socai2-ca.crt:/run/certs/ca.crt:ro
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [existing]
networks:
  existing:
    external: true
    name: socai2_default
