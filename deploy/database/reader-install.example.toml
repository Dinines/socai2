# Copy to a selected environment profile. No passwords in this file/argv.
# Use a private PGPASSFILE or a deployment-managed local socket identity.
database = "replace_database"
admin_role = "replace_owner"
function_owner = "replace_owner"
reader_role = "replace_reader"
timeout_seconds = 120
transport = "libpq"
psql_argv = ["psql", "-X", "-w"]

[environment]
PGHOST = "replace_host"
PGPORT = "5432"
# Password authentication with TLS, no client certificate setup.
PGSSLMODE = "require"
PGPASSFILE = "/replace/private/pgpass"

# Required by initialize-current (127) and remove-unused-graph only.
[cleanup]
lock_timeout_seconds = 3
statement_timeout_seconds = 30

# Required for analysis-ingress, fusion-support, lake-alert-receipts (130), lake-alert-deliveries (131).
# initialize-current includes ingress grants and 130/131 when selected.
[analysis_ingress]
role = "replace_ingress"
lock_timeout_seconds = 3
statement_timeout_seconds = 30

# Required by analysis-lifecycle, business-verdict and initialize-current among other analysis migrations.
# Select an existing writer and the lock/statement timeouts for this database.
[analysis]
writer_role = "replace_processor"
lock_timeout_seconds = 3
statement_timeout_seconds = 30
