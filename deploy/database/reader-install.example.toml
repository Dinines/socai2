# Copy to a selected environment profile. No passwords in this file/argv.
# Use a private PGPASSFILE or a deployment-managed local socket identity.
database = "replace_database"
admin_role = "replace_owner"
function_owner = "replace_owner"
reader_role = "replace_reader"
timeout_seconds = 120
transport = "libpq"
psql_argv = ["psql", "-X", "-w"]

[environment]
PGHOST = "replace_host"
PGPORT = "5432"
PGSSLMODE = "verify-full"
PGSSLROOTCERT = "/replace/private/ca.crt"
PGPASSFILE = "/replace/private/pgpass"
