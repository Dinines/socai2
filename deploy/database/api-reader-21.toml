# Run on 21. Existing API identity; keep public application writes unchanged.
database = "aisoc"
admin_role = "spirithub"
function_owner = "aisoc"
reader_role = "aisoc_app"
timeout_seconds = 120
transport = "docker_socket"
psql_argv = ["docker", "--context", "default", "exec", "-i", "spirithub-postgres-1", "psql", "-XwAtq"]
